# diff_tolerances.toml -- per-file, per-column tolerances for scripts/diff_results.jl.
#
# Every column not mentioned here is compared exactly (strings, integers) or, for
# floating-point columns, within [global] rtol/atol. Entries under a file section
# (keyed by CSV basename; `*` glob patterns are allowed in section names and column
# names) can set
#   rtol / atol      -- the tolerance for that column
#   info = true      -- "informational": reported, but NOT counted in the verdict, because
#                       the C++ and Julia values are known to differ for a documented,
#                       non-bug reason (optimizer path, null-space basis sign, tie-break,
#                       different sparse-QR library, timing)
#   note = "..."     -- the reason, printed in the Markdown
# A [[file.rows]] entry marks WHOLE ROWS informational when `column == value`.
# A section name containing `/` is matched against `<dir>_julia/<basename>` instead of the
# basename (the shard files of k9/k9b/k9c/regime are all called shard_N.csv). A section may
# also set `keys = [...]` (its own row identifier) and `cpp = "file.csv"` (the archived C++
# file to compare with, when it is not the same basename).
#
# Triage of the 2026-09-20 full rerun (results/JULIA_VS_CPP.md): every `info` entry below
# names its mechanism. The recurring ones are
#   STALE      the archived C++ CSV predates a later fix of the C++ itself -- F32 (NOROOT's
#              interval clause, 2026-09-04 12:06), F34 (the referee's polygons_overlap, no
#              shrink, d38b0a4 / df9ac5a 2026-09-04 19:06) or the K8a LP recheck (d38b0a4);
#              the current C++ binary reproduces the Julia value (checked for E1 shard 3,
#              K5 125/200 = STATE.md F34, K2a 173/187 and jitter 0 false negatives = F32);
#   PATH       an optimiser trajectory (L-BFGS repair, range_opt, Frank-Wolfe, pattern
#              search, optimize_collision) that agrees to 1e-14 for ~20 iterates and then
#              diverges by rounding (derivations/scratch/b4_path/README.md);
#   FRAME      the null-space basis Phi (LAPACK SVD vs Eigen JacobiSVD) differs by an
#              orthogonal transform, so shape-space SAMPLES X0 + Phi t with the bit-exact
#              MT19937 stream are different points of the same distribution (derivations/
#              scratch/README.md, kind 3); the Julia results/kill/cache and k6/cache were
#              regenerated, so this applies to K1a/K1b/K8a samples too;
#   X0-TIE     X0 itself agrees to 1e-14 but the Eq. (6) projection collapses corners
#              exactly (|cross| < 1e-12 on 12 corners of graphs 127 and 136 under sigma_mc),
#              and the sign tests (convex / reflex, mu = max vs min) flip on the last bit;
#   NOISE-ROOT the certificate's first root on a projection with zero-length edges is a
#              harmonic whose coefficients are 1e-12 rounding (pat2025 patterns, 232
#              collapsed edges on hyperbolic_waterbomb; theta and cert flags agree);
#   RANK       Eigen SparseQR vs SuiteSparse SPQR rank at the same threshold (+-1);
#   TIES       exact-equality ties (std::sort order, average-rank Spearman) on values that
#              are equal only up to rounding;
#   NATIVE     the authors' external CLI (timeouts, machine-dependent).
#
# Sources of the entries: the per-app reports of the driver porters (2026-09-19/20) and
# the header comments of Kirigami/apps/*.jl.

[global]
rtol = 1e-9
atol = 1e-12
# key columns, in this priority order: those present in a file's header identify a row
keys = ["id", "name", "case", "tiling", "kind", "sigma", "variant", "where", "target",
        "source", "sigma_rule", "rule", "amp_idx", "seed", "v", "design", "theta",
        "dir_deg", "stage", "routine", "sites", "family", "X_source", "deg"]
# timing columns are never compared
skip = ["secs", "secs_*", "*_secs", "native_secs", "wall"]

